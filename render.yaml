# Hosted demo on Render. The desktop app needs none of this: it runs the same server
# on the user's own machine and talks to the model they choose.
services:
  - type: web
    name: deis
    runtime: node
    # Free sleeps after 15 minutes idle (about 30 s to wake). Starter ($7/month) stays awake.
    plan: free
    region: frankfurt
    # Deploy a commit only after GitHub's CI checks (.github/workflows/ci.yml) pass on it.
    autoDeployTrigger: checksPass
    # Render's /usr/bin is read-only, so call pnpm through corepack instead of `corepack enable`.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    # `pnpm start` listens on this computer only; Render must reach the server from outside.
    startCommand: corepack pnpm exec next start -H 0.0.0.0
    healthCheckPath: /api/status
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      # Electron is for the desktop installers; the web service never runs it.
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      # Rate-limits the demo's own Gemma and refuses local model addresses (no SSRF).
      - key: DEIS_HOSTED
        value: "1"
      - key: SITE_URL
        value: https://deiscareers.tech
      # The demo key's budget for everyone together, on top of each person's hourly limits.
      - key: DEMO_HOURLY_CAP
        value: "600"
      - key: DEMO_DAILY_CAP
        value: "3000"
      # The demo's Gemma: Google AI Studio's free tier first …
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemma-4-26b-a4b-it
      # … then other Gemma hosts for when AI Studio is having a bad day, set in the dashboard.
      # FALLBACK_* is OpenRouter (https://openrouter.ai/api/v1, model google/gemma-4-26b-a4b-it,
      # on a key with a credit limit). FALLBACK_2_* is optional: any third OpenAI-compatible host.
      - key: FALLBACK_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: FALLBACK_MODEL
        value: google/gemma-4-26b-a4b-it
      - key: FALLBACK_API_KEY
        sync: false
      - key: FALLBACK_2_BASE_URL
        sync: false
      - key: FALLBACK_2_MODEL
        sync: false
      - key: FALLBACK_2_API_KEY
        sync: false
      # The shared Irish job feed: one Google Jobs search per role family, cached two days.
      - key: SERPAPI_KEY
        sync: false
      # The key is shared with other projects, so the demo takes 150 of its 250 a month.
      - key: SERPAPI_MONTHLY_BUDGET
        value: "130"
      # And at most 20 a day, so one bad day can't spend the month.
      - key: SERPAPI_DAILY_BUDGET
        value: "30"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: deis-cache
          property: connectionString
      # Sentry: agent traces and guard issues. Never prompts, CVs or keys.
      # A DSN can only send events, so it is fine in the repo.
      - key: SENTRY_DSN
        value: https://8bd442bdbb309e905151b8b25032e60b@o4512237895417856.ingest.de.sentry.io/4512249652641872
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://8bd442bdbb309e905151b8b25032e60b@o4512237895417856.ingest.de.sentry.io/4512249652641872
      # Optional: readable stack traces (source maps uploaded at build time).
      - key: SENTRY_ORG
        value: tfc-research-and-innovation-li
      - key: SENTRY_PROJECT
        value: deis
      - key: SENTRY_AUTH_TOKEN
        sync: false
      # Mastra Platform: traces of each agent call and kit workflow (names, timings, models,
      # tokens). Never prompts, CVs or outputs: src/mastra/observability.ts strips them.
      - key: MASTRA_PLATFORM_ACCESS_TOKEN
        sync: false
      - key: MASTRA_PROJECT_ID
        sync: false
      # Polar: /checkout opens a checkout for the desktop app (the app's Buy button links here).
      # Organization access token with checkouts scope; the webhook secret once /api/webhook/polar is registered.
      - key: POLAR_ACCESS_TOKEN
        sync: false
      - key: POLAR_WEBHOOK_SECRET
        sync: false
      - key: POLAR_SERVER
        value: production

  # Render Key Value (Valkey). Internal only: holds the job feed cache, the demo's rate limits
  # and this month's SerpApi count, so a sleeping web service wakes without spending searches.
  # Paid because a workspace gets one free Key Value, and Return Route has it.
  - type: keyvalue
    name: deis-cache
    plan: 256mb
    region: frankfurt
    # Every key has an expiry, and when memory runs out the one closest to expiring goes
    # first: rate-limit counts (an hour), then job caches (hours to days), and this month's
    # SerpApi count last. Under allkeys-lru a flood of new keys could evict that count and
    # reset the budget.
    maxmemoryPolicy: volatile-ttl
    ipAllowList: []
