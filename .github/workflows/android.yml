# The Android app (mobile/): a Capacitor shell that loads https://deiscareers.tech. Run by hand
# from the Actions tab (the APK is kept as an artifact for 14 days), or by pushing a v* tag,
# which also attaches Deis-android.apk to that GitHub Release, next to the desktop installers.
# The name doesn't change between versions, so releases/latest/download/Deis-android.apk always
# points at the newest one (the /download page uses it).
#
# Signing: the keystore lives only in repository secrets (ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), never in the repo. Every
# release must be signed with the same key, or Android won't install it over the last one.
# Without the secrets a hand run builds a debug APK instead, and a tag run fails.
name: Android app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - name: Keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/deis.p12"
            echo "path=$RUNNER_TEMP/deis.p12" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::A release needs the signing secrets (ANDROID_KEYSTORE_BASE64 and the rest)."
            exit 1
          else
            echo "::warning::No signing secrets, so this is a debug build."
          fi
      - name: Build
        working-directory: mobile/android
        env:
          DEIS_KEYSTORE: ${{ steps.keystore.outputs.path }}
          DEIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../../release
          if [ -n "$DEIS_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../../release/Deis-android.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../release/Deis-android.apk
          fi
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs ../../release/Deis-android.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: deis-android
          path: release/Deis-android.apk
          retention-days: 14

  # Install the APK on an emulator, open it, and keep a screenshot and the log: the shell
  # starts, loads the hosted app, and doesn't crash.
  launch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deis-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r Deis-android.apk
            adb logcat -c
            adb shell am start -W -n ie.deis.app/.MainActivity
            sleep 45
            adb exec-out screencap -p > launch.png
            adb logcat -d > logcat.txt
            adb shell pidof ie.deis.app
            ! grep -E "FATAL EXCEPTION.*ie\.deis\.app|AndroidRuntime.*ie\.deis\.app" logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deis-android-launch
          path: |
            launch.png
            logcat.txt
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, launch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deis-android
      - uses: softprops/action-gh-release@v2
        with:
          files: Deis-android.apk
