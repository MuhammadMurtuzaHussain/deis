# Desktop installers for macOS (Apple Silicon and Intel), Windows and Linux. Run by hand from
# the Actions tab (installers kept as artifacts for 14 days), or by pushing a v* tag, which
# also publishes them as a GitHub Release. Each packaged app is launched once before it's
# kept (scripts/smoke-desktop.mjs). File names don't change between versions, so
# releases/latest/download/<name> always points at the newest one (the /download page uses it),
# and latest.yml / latest-linux.yml let installed copies on Windows and Linux update themselves.
# Unsigned for now: the README and /download say how to open them.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Route types (LayoutProps) are generated, as in ci.yml.
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac-arm64
            target: --mac dmg --arm64
            app: release/mac-arm64/Deis.app/Contents/MacOS/Deis
            files: |
              release/*.dmg
          - os: macos-15-intel
            name: mac-x64
            target: --mac dmg --x64
            app: release/mac/Deis.app/Contents/MacOS/Deis
            files: |
              release/*.dmg
          - os: windows-latest
            name: windows-x64
            target: --win nsis --x64
            app: release/win-unpacked/Deis.exe
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: ubuntu-latest
            name: linux-x64
            target: --linux AppImage --x64
            app: release/linux-unpacked/deis
            files: |
              release/*.AppImage
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # desktop:build also writes the starter jobs for an offline first run (soft-fails) and bundles
      # electron-updater. The window never reports to Sentry; desktop-prepare fails the build if a DSN got inlined.
      - run: pnpm desktop:build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ""
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Launch test
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.mjs "${{ matrix.app }}"
      - name: Launch test (virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a node scripts/smoke-desktop.mjs "${{ matrix.app }}" --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: deis-${{ matrix.name }}
          path: ${{ matrix.files }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
