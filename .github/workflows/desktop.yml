# Desktop installers for macOS, Windows and Linux. Run by hand from the Actions tab (the
# installers are kept as artifacts for 14 days), or by pushing a v* tag, which also
# publishes them as a GitHub Release. Unsigned for now: the README says how to open them.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac dmg --arm64
            files: release/*.dmg
          - os: windows-latest
            target: --win nsis --x64
            files: release/*.exe
          - os: ubuntu-latest
            target: --linux AppImage --x64
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # desktop:build also writes the starter jobs for an offline first run (soft-fails).
      # The window never reports to Sentry; desktop-prepare fails the build if a DSN got inlined.
      - run: pnpm desktop:build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ""
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: deis-${{ matrix.os }}
          path: ${{ matrix.files }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
