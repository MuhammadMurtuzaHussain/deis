# Desktop installers for macOS, Windows and Linux. Run by hand from the Actions tab, or
# by pushing a v* tag. Unsigned for now: the README says how to open them.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac dmg --arm64
            files: release/*.dmg
          - os: windows-latest
            target: --win nsis --x64
            files: release/*.exe
          - os: ubuntu-latest
            target: --linux AppImage --x64
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: deis-${{ matrix.os }}
          path: ${{ matrix.files }}
          retention-days: 14
