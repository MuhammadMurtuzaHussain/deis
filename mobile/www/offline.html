<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deis</title>
  <style>
    :root { color-scheme: light dark; --bg: #f2f2f3; --ink: #0e0f10; --ink-2: #4a4c50; --pop: #c8f03c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0f10; --ink: #f2f2f3; --ink-2: #a8aaae; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 34ch; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 28px; line-height: 1.1; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--ink-2); }
    button { justify-self: start; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--pop); color: #0e0f10; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Deis can't reach the internet</h1>
    <p>The Android app reads jobs and runs Gemma through deiscareers.tech. Your profile and applications are safe on this phone.</p>
    <p>Check your connection, then try again.</p>
    <button type="button" onclick="location.replace('https://deiscareers.tech/')">Try again</button>
  </main>
</body>
</html>
